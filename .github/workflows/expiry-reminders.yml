name: Expiry Reminders

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST daily
    - cron: '30 3 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send listing expiry reminders + expire stale badges
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ secrets.BACKEND_URL }}/api/v1/cron/expiry-reminders?secret=${{ secrets.CRON_SECRET }}")
          cat /tmp/response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Cron endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi
