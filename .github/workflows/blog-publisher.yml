name: Blog Publisher

on:
  schedule:
    # 3:00 AM UTC Sunday = 8:30 AM IST — weekly, one evergreen guide article
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      city:
        description: 'Force a city (leave empty to auto-rotate)'
        required: false
        type: string
      state:
        description: 'State for the forced city (required if city is set)'
        required: false
        type: string
      category:
        description: 'Force a category (leave empty to auto-rotate)'
        required: false
        type: string

permissions:
  contents: write   # this workflow commits the generated post back to the repo
  actions: write    # needed to trigger the frontend deploy workflow below

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r agents/requirements.txt

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.city }}" ]; then
            python agents/blog_agent.py \
              --city "${{ github.event.inputs.city }}" \
              --state "${{ github.event.inputs.state }}" \
              --category "${{ github.event.inputs.category }}"
          else
            python agents/blog_agent.py --auto-rotate
          fi

      - name: Commit and push generated post
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/content/blog/ agents/state/blog_rotation.json
          [ -f agents/output/llm_usage_log.jsonl ] && git add agents/output/llm_usage_log.jsonl
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "blog: auto-publish weekly guide article"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN-authored push does NOT trigger other workflows' `on:
      # push` — a deliberate GitHub anti-recursion rule, not a bug — so the
      # new post would otherwise sit committed but never actually deployed.
      # Explicitly dispatch the existing deploy workflow instead.
      - name: Trigger frontend deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy Frontend to Azure Static Web Apps" --ref master

      # Waits for the article to actually be live (polls the real URL, no
      # blind sleep) before posting a link to it — see share_blog_post.py.
      - name: Share new post to Facebook
        if: steps.commit.outputs.committed == 'true'
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: python agents/share_blog_post.py --publish

      # share_blog_post.py logs to the same file the Social Poster workflow
      # commits — but this is a different ephemeral runner, so that log
      # entry needs its own commit here or it's lost when this job ends.
      - name: Commit Facebook share log
        if: steps.commit.outputs.committed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f agents/output/social_posts_log.jsonl ] && git add agents/output/social_posts_log.jsonl
          if git diff --cached --quiet; then
            echo "No log changes to commit"
            exit 0
          fi
          git commit -m "chore: log blog post Facebook share"
          git pull --rebase origin master
          git push
