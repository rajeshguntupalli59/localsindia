name: Keep Backend Alive

on:
  schedule:
    - cron: '*/25 * * * *'  # every 25 minutes (GitHub throttles sub-10-min schedules)
  workflow_dispatch:        # manual trigger if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf https://localsindia-backend.azurewebsites.net/api/v1/health || echo "Backend warming up"
