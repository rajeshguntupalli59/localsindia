name: Deploy Backend to Azure App Service

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-azure.yml'

# Two overlapping `az webapp deploy` calls against the same App Service were
# observed causing/worsening the "site failed to start" flakiness (each
# deploy's restart/extraction cycle stepping on the other's). Queue runs
# instead of letting them race; don't cancel one mid-deploy since that can
# leave the site in a half-deployed state.
concurrency:
  group: backend-azure-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Zip application
        run: |
          cd backend
          zip -r ../backend.zip . -x "*.pyc" -x "__pycache__/*" -x ".env" -x "tests/*" -x ".pytest_cache/*"

      - name: Login to Azure
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Run database migrations
        run: |
          cd backend
          DB_URL=$(az webapp config appsettings list \
            --name localsindia-backend-in \
            --resource-group localsindia-rg \
            --query "[?name=='DATABASE_URL'].value" -o tsv)
          DATABASE_URL="$DB_URL" alembic upgrade head

      - name: Deploy to Azure App Service
        id: deploy
        continue-on-error: true
        run: |
          # `az webapp deploy` defaults to --track-status true, which makes
          # the CLI block not just for the zip to upload/extract (Kudu itself
          # confirms that in ~2-3 min every time, checked directly against
          # the deployment log) but ALSO for the site to report a healthy
          # startup afterward, up to --timeout. Site startup is the genuinely
          # flaky part here — and we already wait for it properly, with real
          # bounded retries, in the very next step ("Restart app and wait for
          # health"). Tracking it here too meant a slow-to-warm-up site (not
          # a failed deploy) silently ate the full --timeout, the CLI call
          # returned as "failed", and this loop then re-uploaded and
          # re-deployed a zip that had already deployed successfully —
          # doubling wall-clock time for no reason (confirmed: two separate
          # complete Kudu deployments, 11 minutes apart, from one push).
          # --track-status false makes this step measure only what it can
          # legitimately retry on: did the artifact actually deploy.
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Deploy attempt $attempt/$MAX_ATTEMPTS"
            if az webapp deploy \
              --resource-group localsindia-rg \
              --name localsindia-backend-in \
              --src-path backend.zip \
              --type zip \
              --restart true \
              --track-status false \
              --timeout 300000; then
              echo "::endgroup::"
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "Deploy attempt $attempt failed."
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in 20s..."
              sleep 20
            fi
          done
          echo "All $MAX_ATTEMPTS deploy attempts failed."
          exit 1

      - name: Wait for health
        run: |
          # OneDeploy (--restart true above) already recycles the container
          # itself once extraction is genuinely complete — it writes
          # restartTrigger.txt only after the venv/packages are fully in
          # place, so it can't race the way a blind sleep-then-restart can.
          # A prior version of this step used --restart false + a hardcoded
          # `sleep 90` before manually forcing a restart; actual build times
          # observed here range up to ~233s, so on slower deploys that manual
          # restart fired while Kudu was still mid-extraction, booting the
          # container against a half-written wwwroot (missing antenv/venv,
          # "uvicorn: not found", exit code 127 crash loop). Just poll health
          # now — no restart call needed here at all.
          echo "Waiting for app to start..."
          for i in $(seq 1 18); do
            sleep 10
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://localsindia-backend-in.azurewebsites.net/api/v1/health --max-time 10 || echo "000")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is up!"
              exit 0
            fi
          done
          echo "Backend did not respond in time — check Azure logs"
          exit 1

      - name: Fail job if deploy step actually failed
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "The 'Deploy to Azure App Service' step reported failure."
          echo "Health check passing above only proves *some* container is healthy -"
          echo "it may be the stale, pre-deploy version still running, not this commit."
          echo "Re-run the deploy manually and confirm the new code is actually live."
          exit 1
